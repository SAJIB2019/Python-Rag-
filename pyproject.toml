[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-from-zero-fastapi"
version = "1.0.0"
description = "Async FastAPI port of the RAG From Zero backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "asyncpg>=0.30,<1", "arq>=0.26,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "llama-index-core>=0.12,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
  "beautifulsoup4>=4.12,<5", "prometheus-client>=0.21,<1",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires dedicated PostgreSQL and Redis services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]
